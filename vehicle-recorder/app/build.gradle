plugins { id 'com.android.application' }
android {
    namespace 'com.family.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.family.recorder'
        minSdk 21
        // Dedicated Android 5–8 device; legacy filesystem/camera behavior is intentional.
        targetSdk 28
        versionCode 5
        versionName '1.2.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion', 'OldTargetApi' }
}
