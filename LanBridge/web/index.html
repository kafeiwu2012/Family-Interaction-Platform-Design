<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LanBridge 文件共享</title>
<style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;margin:0;background:#f2f5fa;color:#18263c}header{background:#142e52;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}header p{color:#bdd0e9}main{max-width:1100px;margin:24px auto;padding:0 16px}button,.btn{border:1px solid #cad4e1;border-radius:9px;background:white;padding:10px 14px;cursor:pointer;color:#183d6c;font:inherit}button:hover{background:#eaf2ff}.primary{background:#2366cf;color:white}input{padding:11px;border:1px solid #bac8dc;border-radius:8px;max-width:100%;font:inherit}.card{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:20px;margin-bottom:18px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}#path{word-break:break-all;margin:18px 0;color:#526883}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 6px;border-bottom:1px solid #edf0f5}td:first-child{word-break:break-all}td:last-child{text-align:right}small{color:#657990}progress{width:100%;height:22px}#status{white-space:pre-wrap;word-break:break-all}dialog{width:min(900px,95vw);border:0;border-radius:14px;box-shadow:0 10px 80px #172e5266}dialog::backdrop{background:#13284488}textarea{width:100%;height:52vh;font:14px monospace}#preview img,#preview video{max-width:100%;max-height:65vh}#preview iframe{width:100%;height:65vh;border:0}.danger{color:#b12535}@media(max-width:650px){.date{display:none}td{font-size:14px}td button{padding:8px}header{padding:20px}}</style>
<header><h1>LanBridge <small style="color:#bdd0e9">局域网文件共享</small></h1><p>Windows · iPhone · iPad / 文件留在你的设备与局域网</p></header><main>
<section class="card" id="login"><h2>连接共享空间</h2><p>输入 Windows 程序窗口中显示的连接口令，或使用完整访问链接。</p><div class="tools"><input id="token" type="password" placeholder="连接口令" autocomplete="off"><button class="primary" id="connect">连接</button></div></section>
<section class="card" id="files" hidden><div class="tools"><button id="up">↑ 上一级</button><button id="refresh">刷新</button><button id="mkdir">新建文件夹</button><label class="btn primary">上传文件<input type="file" id="upload" multiple hidden></label><button id="logout">断开连接</button></div><p id="path"></p><p><small>上传会校验每个分块，完整写入后才出现目标文件；同名文件不覆盖。iOS 上传请从“文件”或照片中选择。</small></p><table><thead><tr><th>文件名</th><th>大小</th><th class="date">修改时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="card"><strong>传输状态</strong><progress id="progress" value="0" max="100"></progress><div id="status" role="status">等待连接</div><button id="cancel" hidden>取消当前传输</button><p><small>请保持浏览器在前台。浏览器关闭或服务重启后需要重新上传。删除的文件和编辑前版本保留在电脑共享目录的 .bridge/trash 中。</small></p></section>
</main><dialog id="dialog"><div class="tools"><strong id="title"></strong><button id="close">关闭</button></div><div id="preview"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=decodeURIComponent(location.hash.slice(1))||sessionStorage.getItem('lanToken')||'',cwd='',active=false,cancelled=false,objectURL;
if(location.hash)history.replaceState(null,'',location.pathname);$('token').value=token;
function status(t){$('status').textContent=t}function full(n){return cwd?cwd+'/'+n:n}function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
async function api(url,method='GET',data,headers={}){let r=await fetch(url,{method,headers:{'X-Token':token,...(data&&typeof data==='string'?{'Content-Type':'application/json'}:{}),...headers},body:data});if(!r.ok)throw Error(await r.text());return r.json()}
async function list(){let rows=await api('/api/list?path='+encodeURIComponent(cwd));$('rows').replaceChildren();$('path').textContent='共享空间 / '+cwd;rows.sort((a,b)=>Number(b.dir)-Number(a.dir)||a.name.localeCompare(b.name));for(let f of rows){let tr=document.createElement('tr');let name=document.createElement('td'),b=document.createElement('button');b.textContent=(f.dir?'📁 ':'📄 ')+f.name;b.onclick=()=>safe(async()=>{if(f.dir){cwd=full(f.name);await list()}else await preview(full(f.name))});name.append(b);tr.append(name);let sz=document.createElement('td');sz.textContent=f.dir?'文件夹':size(f.size);tr.append(sz);let date=document.createElement('td');date.className='date';date.textContent=new Date(f.modified).toLocaleString();tr.append(date);let ops=document.createElement('td'),sel=document.createElement('select');sel.setAttribute('aria-label','文件操作');for(let [v,t]of [['','操作…'],...(!f.dir?[['download','下载'],['copy','复制']]:[]),['move','移动 / 改名'],['delete','删除']]){let o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)}sel.onchange=()=>{let op=sel.value;sel.value='';safe(()=>action(op,full(f.name),f))};ops.append(sel);tr.append(ops);$('rows').append(tr)}if(!rows.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='此文件夹为空，可从电脑或手机上传文件';tr.append(td);$('rows').append(tr)}}
async function safe(fn){try{await fn()}catch(e){status('操作失败：'+e.message)}}
async function connect(){token=$('token').value.trim();await list();sessionStorage.setItem('lanToken',token);$('login').hidden=true;$('files').hidden=false;status('已连接，共享服务就绪')}
$('connect').onclick=()=>safe(connect);$('logout').onclick=()=>{sessionStorage.removeItem('lanToken');location.reload()};$('refresh').onclick=()=>safe(list);$('up').onclick=()=>safe(async()=>{cwd=cwd.split('/').slice(0,-1).join('/');await list()});$('mkdir').onclick=()=>safe(async()=>{let n=prompt('文件夹名称');if(n){await api('/api/action?path='+encodeURIComponent(full(n)),'POST',JSON.stringify({Op:'mkdir'}));await list()}});
async function action(op,p,f){if(!op)return;if(op==='download')return download(p,f.size);let data={Op:op};if(op==='delete'){if(!confirm('将“'+f.name+'”移入电脑端备份区？'))return}else {let to=prompt('目标路径（相对于共享根目录，包含文件名；目标不能已存在）',p);if(!to||to===p)return;data.To=to}await api('/api/action?path='+encodeURIComponent(p),'POST',JSON.stringify(data));await list();status('操作完成')}
// SHA-256 also works on local HTTP in Safari where SubtleCrypto is unavailable.
function sha256(buf){let b=new Uint8Array(buf),len=b.length,pad=new Uint8Array(((len+9+63)>>6)<<6);pad.set(b);pad[len]=128;let dv=new DataView(pad.buffer);dv.setUint32(pad.length-4,len*8);const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],W=new Uint32Array(64),R=(x,n)=>(x>>>n)|(x<<(32-n));for(let o=0;o<pad.length;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+4*i);for(let i=16;i<64;i++){let a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(R(a,7)^R(a,18)^(a>>>3))+W[i-7]+(R(b,17)^R(b,19)^(b>>>10)))>>>0}let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){let t=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0,u=((R(a,2)^R(a,13)^R(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t)>>>0;d=c;c=b;b=a;a=(t+u)>>>0}H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])>>>0)}return H.map(v=>v.toString(16).padStart(8,'0')).join('')}
async function retry(fn){let last;for(let i=0;i<4;i++){if(cancelled)throw Error('已取消；未完成文件不会出现在共享目录');try{return await fn()}catch(e){last=e;await new Promise(r=>setTimeout(r,600*(i+1)))}}throw last}
$('cancel').onclick=()=>{cancelled=true};$('upload').onchange=()=>safe(async()=>{if(active)throw Error('请等待当前传输完成');active=true;cancelled=false;$('cancel').hidden=false;let files=[...$('upload').files],target=cwd;try{for(let f of files){let path=target?target+'/'+f.name:f.name;let u=await api('/api/start?path='+encodeURIComponent(path),'POST',JSON.stringify({Size:f.size}));let off=0;while(off<f.size){if(cancelled)throw Error('已取消');let chunk=await f.slice(off,off+2*1024*1024).arrayBuffer(),h=sha256(chunk);let r=await retry(()=>api('/api/chunk?id='+u.id+'&offset='+off,'POST',chunk,{'X-SHA256':h}));off=r.offset;$('progress').value=f.size?off/f.size*100:100;status('上传 '+f.name+' · '+size(off)+' / '+size(f.size))}if(cancelled)throw Error('已取消');status('完整性核验并提交 '+f.name);let result=await api('/api/finish?id='+u.id,'POST');$('progress').value=100;status('上传完成：'+f.name+'\nSHA-256：'+result.sha256)}await list()}finally{active=false;$('cancel').hidden=true;$('upload').value=''}});
async function download(p,n){if(active)throw Error('请等待当前传输完成');if(n>128*1024*1024){let ticket=await api('/api/ticket?path='+encodeURIComponent(p),'POST');let a=document.createElement('a');a.href=ticket.url;a.download=p.split('/').pop();a.click();status('大文件已交给浏览器直接保存，请在浏览器下载列表查看进度。');return;}active=true;try{await new Promise((resolve,reject)=>{let x=new XMLHttpRequest();x.open('GET','/api/download?path='+encodeURIComponent(p));x.setRequestHeader('X-Token',token);x.responseType='blob';x.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100;status('下载 '+p+' · '+size(e.loaded)+' / '+size(n))};x.onerror=()=>reject(Error('下载中断，请重试'));x.onload=()=>{if(x.status!==200)return reject(Error('下载失败'));let u=URL.createObjectURL(x.response),a=document.createElement('a');a.href=u;a.download=p.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(u),120000);$('progress').value=100;status('下载已交给浏览器，请在下载列表或“文件”中保存');resolve()};x.send()})}finally{active=false}}
async function preview(p){let ext=p.split('.').pop().toLowerCase(),host=$('preview');host.replaceChildren();$('title').textContent=p;if(['txt','md','csv','json','log','xml','yaml','yml','js','css','html','ini'].includes(ext)){let data=await api('/api/text?path='+encodeURIComponent(p));let ta=document.createElement('textarea');ta.value=data.text;host.append(ta);let save=document.createElement('button');save.textContent='保存文本（保留原版本）';save.onclick=()=>safe(async()=>{await api('/api/action?path='+encodeURIComponent(p),'POST',JSON.stringify({Op:'save',Text:ta.value,Hash:data.hash}));status('已保存，旧版本已备份');$('dialog').close();await list()});host.append(save)}else if(['jpg','jpeg','png','gif','webp','heic','mp4','mov','mp3','wav','pdf'].includes(ext)){status('正在加载预览（上限 64MB）');let r=await fetch('/api/download?path='+encodeURIComponent(p),{headers:{'X-Token':token}});if(!r.ok)throw Error(await r.text());if(Number(r.headers.get('Content-Length'))>64*1024*1024){await r.body.cancel();throw Error('文件太大，请下载预览')}let blob=await r.blob();objectURL=URL.createObjectURL(blob);let tag=['mp4','mov'].includes(ext)?'video':['mp3','wav'].includes(ext)?'audio':ext==='pdf'?'iframe':'img';let el=document.createElement(tag);el.src=objectURL;if(tag==='iframe')el.setAttribute('sandbox','');if(tag==='video'||tag==='audio')el.controls=true;host.append(el);status('预览已加载；格式支持取决于浏览器')}else{host.textContent='此格式请下载后使用对应应用打开。'}$('dialog').showModal()}
$('close').onclick=()=>$('dialog').close();$('dialog').onclose=()=>{if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}$('preview').replaceChildren()};if(token)safe(connect);
</script></html>
