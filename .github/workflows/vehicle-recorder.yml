name: Vehicle recorder Android
on:
  push:
    paths: ['vehicle-recorder/**', '.github/workflows/vehicle-recorder.yml']
  pull_request:
    paths: ['vehicle-recorder/**', '.github/workflows/vehicle-recorder.yml']
  workflow_dispatch:
concurrency:
  group: vehicle-recorder-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Storage policy and source checks
        run: bash vehicle-recorder/tests/check.sh
      - name: Build and lint
        working-directory: vehicle-recorder
        run: |
          if ! gradle --no-daemon :app:assembleDebug :app:lintDebug; then
            cat app/build/reports/lint-results-debug.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-recorder-debug
          path: vehicle-recorder/app/build/outputs/apk/debug/*.apk
