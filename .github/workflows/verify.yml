name: Verify
on: [push, pull_request, workflow_dispatch]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s server -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/media-tests
          javac -d /tmp/media-tests android/app/src/main/java/org/family/capture/MediaNames.java android/app/src/main/java/org/family/capture/MediaArchive.java tests/java/org/family/capture/MediaArchiveTest.java
          java -cp /tmp/media-tests org.family.capture.MediaArchiveTest
      - run: gradle --no-daemon assembleDebug lint
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: family-capture-debug
          path: android/app/build/outputs/apk/debug/*.apk
